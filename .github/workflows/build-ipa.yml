name: Build LingFan IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  SCHEME: LingFan
  APP_NAME: LingFan

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 准备 Vendor 目录（下载 libadb 静态库）
        env:
          GH_TOKEN: ${{ secrets.LIBADB_TOKEN }}
        run: bash scripts/fetch_libadb.sh

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          ls -la

      - name: 编译 Debug 版 .app
        run: |
          set -o pipefail
          xcodebuild \
            -project LingFan.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee /tmp/build.log | tail -60

      - name: 汇总编译错误
        if: failure()
        run: bash scripts/report_errors.sh

      - name: 打包为未签名 IPA
        run: bash scripts/package_ipa.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: LingFan-unsigned-ipa
          path: LingFan-unsigned.ipa
          retention-days: 90

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 30
